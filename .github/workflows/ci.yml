name: CI
on: [push, pull_request]
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      DATA_DIR: .data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm start & npx wait-on -t 60000 http://localhost:3000
      - run: BASE_URL=http://localhost:3000 node scripts/smoke.mjs
